name: Quality & Android Pipeline

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Typecheck, Lint, 100% Coverage, Architecture & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (reproducible lockfile)
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        run: pnpm audit --audit-level=critical || true

      - name: TypeScript Strict Typecheck
        run: pnpm typecheck

      - name: ESLint Static Analysis
        run: pnpm lint

      - name: Architecture & Circular Dependency Check
        run: pnpm test:architecture

      - name: Unit & Integration Tests with 100% Coverage Threshold
        run: pnpm test:coverage

      - name: Production Build
        run: pnpm build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-android-apk:
    name: Build Android APK (Capacitor + Gradle)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Sync Capacitor Android Project
        run: pnpm exec cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelforge-virtual-creatures-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish APK to GitHub Releases
    needs: build-android-apk
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: pixelforge-virtual-creatures-debug-apk
          path: ./release-apk/

      - name: Rename APK with Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp ./release-apk/app-debug.apk ./release-apk/pixelforge-virtual-creatures-v${VERSION}.apk

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: PixelForge Virtual Creatures ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          files: ./release-apk/pixelforge-virtual-creatures-*.apk
          generate_release_notes: true
