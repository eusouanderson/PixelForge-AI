name: Quality & Android Pipeline

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Typecheck, Lint, 100% Coverage, Architecture & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (reproducible lockfile)
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        run: pnpm audit --audit-level=critical || true

      - name: TypeScript Strict Typecheck
        run: pnpm typecheck

      - name: ESLint Static Analysis
        run: pnpm lint

      - name: Architecture & Circular Dependency Check
        run: pnpm test:architecture

      - name: Unit & Integration Tests with 100% Coverage Threshold
        run: pnpm test:coverage

      - name: Production Build
        run: pnpm build
