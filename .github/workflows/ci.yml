name: Quality, Android & Auto-Release Pipeline

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Typecheck, Lint, 100% Coverage, Architecture & Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      apk_name: ${{ steps.version.outputs.apk_name }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      bump_type: ${{ steps.version.outputs.bump_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (reproducible lockfile)
        run: pnpm install --frozen-lockfile

      - name: Determine & Bump Version (on main)
        id: version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            node scripts/bump-version.mjs
          else
            node scripts/bump-version.mjs --dry-run
          fi

      - name: Security Audit
        run: pnpm audit --audit-level=critical || true

      - name: TypeScript Strict Typecheck
        run: pnpm typecheck

      - name: ESLint Static Analysis
        run: pnpm lint

      - name: Architecture & Circular Dependency Check
        run: pnpm test:architecture

      - name: Unit & Integration Tests with 100% Coverage Threshold
        run: pnpm test:coverage

      - name: Production Web Build
        run: pnpm build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-android-apk:
    name: Build Android APK (Capacitor + Gradle)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Version for Build
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            node scripts/bump-version.mjs --set-version=${{ needs.quality.outputs.version }} --build=${{ needs.quality.outputs.build }}
          fi

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Sync Capacitor Android Project
        run: pnpm exec cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Restore Persistent Debug Keystore Cache (Fallback when Secrets unset)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build Signed Android APK
        working-directory: ./android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pixelforge-signing.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/pixelforge-signing.jks"
            ./gradlew assembleRelease --no-daemon
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret não configurado; usando fallback debug.keystore em cache."
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelforge-virtual-creatures-debug-apk
          path: android/app/build/outputs/apk/*/pixelforge-virtual-creatures-*.apk
          if-no-files-found: error

  release:
    name: Publish Versioned APK & Release
    needs: [quality, build-android-apk]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Version
        id: release-version
        run: |
          node scripts/bump-version.mjs --set-version=${{ needs.quality.outputs.version }} --build=${{ needs.quality.outputs.build }}

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: pixelforge-virtual-creatures-debug-apk
          path: ./release-apk/

      - name: Re-generate Manifest with Actual APK Checksum
        run: |
          pnpm build:bundle

      - name: Commit Bumped Version to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src/shared/constants/app-config.ts android/app/build.gradle public/version.json
          git commit -m "chore(release): bump version to v${{ needs.quality.outputs.version }} [skip ci]" || echo "No changes to commit"
          git tag "v${{ needs.quality.outputs.version }}" || echo "Tag already exists"
          git push origin main --tags || echo "Failed to push tag"

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.quality.outputs.tag_name || 'v1.0.0' }}
          name: PixelForge AI ${{ needs.quality.outputs.tag_name || 'v1.0.0' }}
          files: |
            ./release-apk/pixelforge-virtual-creatures-*.apk
            ./dist/web-bundle.zip
            ./dist/version.json
          generate_release_notes: true

      - name: Upload Final Dist for Pages
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: dist/

  deploy-pages:
    name: Deploy GitHub Pages (Zero Race Condition)
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Final Dist
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
